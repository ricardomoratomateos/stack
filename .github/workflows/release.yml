name: Release

# Cutting a release is pushing a tag: `npm version minor && git push --follow-tags`
# (see RELEASING.md). Everything below is what that tag sets off.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Same reason as ci.yml: without tmux the integration tests skip silently.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci

      - name: The tag must be the version in package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"

      # The same gate as CI, run again here: a tag can be pushed from a branch
      # CI never saw, and nothing should reach a marketplace without it.
      - run: npm run typecheck
      - run: npm run test:coverage

      - run: npx vsce package --no-dependencies --out "foreman-${VERSION}.vsix"

      - name: Release notes are the CHANGELOG entry for this version
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section"
            exit 1
          fi

      - name: GitHub release with the .vsix attached
        run: |
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          gh release create "v$VERSION" "foreman-$VERSION.vsix" \
            --title "v$VERSION" --notes-file RELEASE_NOTES.md $PRE

      # Both publishes are skipped, not failed, while the token is absent — so
      # GitHub releases work from day one and the marketplaces join when the
      # secrets exist. VSCE_PAT: Azure DevOps token, Marketplace (Manage) scope.
      # OVSX_PAT: open-vsx.org access token, after signing the publisher agreement.
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath "foreman-${VERSION}.vsix" -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "foreman-${VERSION}.vsix" -p "$OVSX_PAT"
