name: Release

# Cutting a release is pushing a tag: `npm version minor && git push --follow-tags`.
# Everything below is what that tag sets off. (The desktop app is bundled by hand:
# `cd desktop && npm run bundle`.)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Same reason as ci.yml: without tmux the integration tests skip silently.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci

      - name: The tag must be the version in package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"

      # The same gate as CI, run again here: a tag can be pushed from a branch
      # CI never saw, and nothing should be released without it.
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Release notes are the CHANGELOG entry for this version
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section"
            exit 1
          fi

      - name: GitHub release
        run: |
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          gh release create "v$VERSION" \
            --title "v$VERSION" --notes-file RELEASE_NOTES.md $PRE
