<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Stack: three worktrees stacked, the active one in front with a prompt (›_)
       cut out of it. Equal 10-unit steps and a constant 4-unit gap, each gap cut
       from the card in front grown by 4 — so the offsets stay even at 16px. -->
  <defs>
    <mask id="stack-mid" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="11" y="31" width="58" height="58" rx="16" fill="#000"/>
    </mask>
    <mask id="stack-back" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="21" y="21" width="58" height="58" rx="16" fill="#000"/>
    </mask>
    <mask id="stack-front" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <path d="M27.5 52l9 8-9 8" fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M42.5 68h11" stroke="#000" stroke-width="5.5" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect x="35" y="15" width="50" height="50" rx="12" fill="currentColor" opacity="0.32" mask="url(#stack-back)"/>
  <rect x="25" y="25" width="50" height="50" rx="12" fill="currentColor" opacity="0.6" mask="url(#stack-mid)"/>
  <rect x="15" y="35" width="50" height="50" rx="12" fill="currentColor" mask="url(#stack-front)"/>
</svg>
