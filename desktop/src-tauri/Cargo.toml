[package]
name = "stack-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.1"
tmux-cc = { path = "../tmux-cc" }
libc = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "io-util", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder"] }
