<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#0a0a0a"/>
  <rect x="16" y="16" width="96" height="96" rx="20" fill="#c8ff00"/>
  <!-- The activity-bar mark, scaled from its 64-unit grid and optically centred
       in the lime square. The threads sit at 14/32/50 rather than 20/32/44: the
       tighter spread left the mark letterboxed, reading smaller and weaker than
       its neighbours in a square 24px slot. -->
  <g transform="translate(21.333 21.333) scale(1.33333)"
     fill="none" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8,14 C16,14 22,32 30,32 L56,32"/>
    <path d="M8,32 C16,32 22,50 30,50 L56,50"/>
    <path d="M8,50 C16,50 22,14 30,14 L56,14"/>
  </g>
</svg>
