<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Marketplace tile: the activity-bar mark (resources/icon.svg) on lime. -->
  <rect width="128" height="128" rx="28" fill="#c8ff00"/>
  <g transform="translate(14 14)">
  <defs>
    <mask id="stack-mid" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="11" y="31" width="58" height="58" rx="16" fill="#000"/>
    </mask>
    <mask id="stack-back" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="21" y="21" width="58" height="58" rx="16" fill="#000"/>
    </mask>
    <mask id="stack-front" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <path d="M27.5 52l9 8-9 8" fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M42.5 68h11" stroke="#000" stroke-width="5.5" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect x="35" y="15" width="50" height="50" rx="12" fill="#0a0a0a" opacity="0.32" mask="url(#stack-back)"/>
  <rect x="25" y="25" width="50" height="50" rx="12" fill="#0a0a0a" opacity="0.6" mask="url(#stack-mid)"/>
  <rect x="15" y="35" width="50" height="50" rx="12" fill="#0a0a0a" mask="url(#stack-front)"/>
  </g>
</svg>
